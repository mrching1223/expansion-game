<html lang="zh-Hant-HK">
<head>

<title>因式鍊金術 Factor Alchemy</title>
<script>
/* =====================================================================
   CONFIG — 老師可以喺度修改牌組同設定
   - expr：目標多項式；answer：標準答案（因式相乘，例如 3x(x - 2)、(x + 3)^2）
   - 標準答案入面每個一次因式都要 primitive（係數 gcd = 1，首項係數正數）
   - 遊戲啟動時會自動驗證，有錯會喺畫面顯示錯誤
   - 每張目標卡要有獨一無二嘅 id（成績記錄入面嘅 qid）
   - 學生成績記錄設定（SHEET_ENDPOINT、GAME）喺下面程式碼「teacher score log」嗰段
   ===================================================================== */
window.CONFIG = {
  version: '1.0.0',
  classes: ['2A', '2B', '2C', '2D', '2E'],
  studentNoMin: 1,
  studentNoMax: 40,
  nameMaxLength: 20,

  // 玩法：'simple' 簡易（冇功能卡、冇反應窗口）或 'full' 進階（完整規則）
  defaultRules: 'simple',
  allowRuleChoice: true,              // 學生可以喺設定畫面揀玩法；false = 一律用 defaultRules
  winScore: 15,                       // 進階玩法：先夠呢個分數就勝出
  winScoreSimple: 10,                 // 簡易玩法：先夠呢個分數就勝出
  starsIncluded: [1, 2, 3],           // 老師設定：包含邊幾個星級，例如 [1, 2]
  points: { 1: 1, 2: 2, 3: 3 },
  tableSize: 4,                       // 桌面目標卡數量
  handStart: 6,                       // 進階玩法：起手因式組件卡
  handLimit: 8,                       // 進階玩法：手牌上限
  handStartSimple: 8,                 // 簡易玩法：起手多啲牌，容易湊到答案
  handLimitSimple: 10,                // 簡易玩法：手牌上限（最多 10，再多畫面會太擠）
  hintsPerGame: 3,                    // 每局提示卡
  badgePass: 3,
  // 夥伴（角色卡）：升級所需成功鍊成次數、每局技能次數、用擅長屬性夥伴答對嘅額外鈴錢（按 Lv1/Lv2/Lv3）
  partnerLevels: [0, 5, 15],
  partnerSkillUses: [1, 2, 2],
  partnerTypeBonus: [50, 50, 100],                       // 闖關：第一次就答對（鍊成）呢個數量或以上就得到該方法嘅徽章
  rewards: { first: 300, second: 150, fixed: 150 },   // 鈴錢：第一次答對／第二次答對／錯題本改正；第三次先答對冇獎勵
  reactionMs: { hand: 3000, snipe: 5000 },
  aiThinkMs: [1000, 2000],

  // 因式組件卡總數 60 = 由標準答案生成嘅一次因式 + 陷阱卡 + 單項式卡
  factorDeckSize: 60,
  monomialCards: { '2': 4, '3': 3, '4': 2, '5': 2, '6': 2, 'x': 4, 'y': 2 },
  trapCards: ['2x + 4', '2x - 4', '3x - 6', '2x + 6', '2y + 4', '3x + 3', '2x + 2y', '2x - 6', '5x + 15', '4x + 2'],
  functionCards: { reverse: 5, stone: 5, hand: 5 },   // 逆鍊成、賢者之石、分解之手

  // 四種方法各 10 張；每種方法就係一個關卡（徽章）
  targets: [
    // ★ 提取公因式
    { id: 'c01', stars: 1, expr: '3x^2 - 6x',   answer: '3x(x - 2)' },
    { id: 'c02', stars: 1, expr: '4x + 8',      answer: '4(x + 2)' },
    { id: 'c03', stars: 1, expr: '5x^2 + 15x',  answer: '5x(x + 3)' },
    { id: 'c04', stars: 1, expr: '2xy + 6y',    answer: '2y(x + 3)' },
    { id: 'c05', stars: 1, expr: '6x - 9',      answer: '3(2x - 3)' },
    { id: 'c06', stars: 1, expr: 'x^2 - x',     answer: 'x(x - 1)' },
    { id: 'c07', stars: 1, expr: '6x + 12',     answer: '6(x + 2)' },
    { id: 'c08', stars: 1, expr: '2x^2 + 2xy',  answer: '2x(x + y)' },
    { id: 'c09', stars: 1, expr: '3xy - 3y^2',  answer: '3y(x - y)' },
    { id: 'c10', stars: 1, expr: '4x^2 + 2x',   answer: '2x(2x + 1)' },
    // ★★ 分組分解
    { id: 'g01', stars: 2, expr: 'xy + 2x + 3y + 6',     answer: '(x + 3)(y + 2)' },
    { id: 'g02', stars: 2, expr: 'xy - 2x + 3y - 6',     answer: '(x + 3)(y - 2)' },
    { id: 'g03', stars: 2, expr: 'xy + 2x - y - 2',      answer: '(x - 1)(y + 2)' },
    { id: 'g04', stars: 2, expr: 'x^2 + 3x + xy + 3y',   answer: '(x + 3)(x + y)' },
    { id: 'g05', stars: 2, expr: 'x^2 - 2x + xy - 2y',   answer: '(x - 2)(x + y)' },
    { id: 'g06', stars: 2, expr: '2xy + 4x + y + 2',     answer: '(2x + 1)(y + 2)' },
    { id: 'g07', stars: 2, expr: 'xy - 2x - 2y + 4',     answer: '(x - 2)(y - 2)' },
    { id: 'g08', stars: 2, expr: 'x^2 - 3x - xy + 3y',   answer: '(x - 3)(x - y)' },
    { id: 'g09', stars: 2, expr: '2x^2 + 2xy + 3x + 3y', answer: '(2x + 3)(x + y)' },
    { id: 'g10', stars: 2, expr: '2xy + 4x + 6y + 12',   answer: '2(x + 3)(y + 2)' },
    // ★★★ 平方差恆等式 a² − b² = (a + b)(a − b)（可以先抽公因式）
    { id: 'd01', stars: 3, expr: 'x^2 - 9',          answer: '(x + 3)(x - 3)' },
    { id: 'd02', stars: 3, expr: '2x^2 - 8',         answer: '2(x + 2)(x - 2)' },
    { id: 'd03', stars: 3, expr: '4x^2 - 9',         answer: '(2x + 3)(2x - 3)' },
    { id: 'd04', stars: 3, expr: '3x^2 - 3',         answer: '3(x + 1)(x - 1)' },
    { id: 'd05', stars: 3, expr: 'x^2 - y^2',        answer: '(x + y)(x - y)' },
    { id: 'd06', stars: 3, expr: 'x^2 - 16',         answer: '(x + 4)(x - 4)' },
    { id: 'd07', stars: 3, expr: '9x^2 - 1',         answer: '(3x + 1)(3x - 1)' },
    { id: 'd08', stars: 3, expr: 'x^2 - 4y^2',       answer: '(x + 2y)(x - 2y)' },
    { id: 'd09', stars: 3, expr: '5x^2 - 20',        answer: '5(x + 2)(x - 2)' },
    { id: 'd10', stars: 3, expr: '2x^2 - 18',        answer: '2(x + 3)(x - 3)' },
    // ★★★ 完全平方恆等式 a² ± 2ab + b² = (a ± b)²（可以先抽公因式）
    { id: 'p01', stars: 3, expr: 'x^2 + 6x + 9',     answer: '(x + 3)^2' },
    { id: 'p02', stars: 3, expr: 'x^2 - 4x + 4',     answer: '(x - 2)^2' },
    { id: 'p03', stars: 3, expr: '4x^2 + 4x + 1',    answer: '(2x + 1)^2' },
    { id: 'p04', stars: 3, expr: 'x^2 + 2xy + y^2',  answer: '(x + y)^2' },
    { id: 'p05', stars: 3, expr: '2x^2 - 12x + 18',  answer: '2(x - 3)^2' },
    { id: 'p06', stars: 3, expr: 'x^2 + 4x + 4',     answer: '(x + 2)^2' },
    { id: 'p07', stars: 3, expr: 'x^2 - 6x + 9',     answer: '(x - 3)^2' },
    { id: 'p08', stars: 3, expr: '9x^2 + 6x + 1',    answer: '(3x + 1)^2' },
    { id: 'p09', stars: 3, expr: 'x^2 - 2xy + y^2',  answer: '(x - y)^2' },
    { id: 'p10', stars: 3, expr: '3x^2 + 12x + 12',  answer: '3(x + 2)^2' },
  ],

  // 電腦難度（延遲單位：毫秒）
  ai: {
    apprentice: { missSynth: 0.3,  sloppy: 0.45, useReverse: 0.4, handUse: 0.25, handDelay: [1700, 2800], snipeChance: 0.3,  snipeDelay: [2800, 4700], smartDiscard: 0.5 },
    national:   { missSynth: 0.12, sloppy: 0.06, useReverse: 0.7, handUse: 0.5,  handDelay: [1100, 2300], snipeChance: 0.7,  snipeDelay: [1600, 3800], smartDiscard: 0.8 },
    flame:      { missSynth: 0,    sloppy: 0,    useReverse: 1,   handUse: 0.8,  handDelay: [450, 1100],  snipeChance: 0.97, snipeDelay: [700, 1600],  smartDiscard: 1 },
  },
};
/* CONFIG END */
</script>

<style>
:root {
  --ink: #2b1d0e; --ink-soft: #5a4128;
  --parch: #f2e4c4; --parch-2: #e6d2a4; --parch-3: #cdb17a;
  --gold: #d4a548; --gold-hi: #ffd77a; --brass: #a97c37;
  --blood: #8e1f1f; --teal: #2f6f73; --glow: #8fd8ff;
  --bg: #120c07;
  --serif: "EB Garamond", "Noto Serif TC", "Songti TC", "STSong", "PMingLiU", "MingLiU", "Times New Roman", serif;
  --ui: clamp(13px, 1.55vh + 0.35vw, 18px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--parch); font-family: var(--serif); font-size: var(--ui); }
body { user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none; }
button { font-family: inherit; font-size: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---------- 舞台 ---------- */
#stage { position: fixed; inset: 0; }
#stage canvas, #stage > div { position: absolute; inset: 0; }
#gl { z-index: 0; }
#css3d { z-index: 1; pointer-events: none; }
#fx { z-index: 2; pointer-events: none; }

/* ---------- 卡牌（CSS3D） ---------- */
.card3d { width: 200px; height: 280px; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; pointer-events: auto; cursor: pointer; }
.card3d .face { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.card3d .front {
  color: var(--ink); background-color: var(--parch); background-size: 100% 100%;
  border: 3px solid #6d4c25; display: flex; flex-direction: column; align-items: center;
  box-shadow: 0 6px 14px rgba(0,0,0,.45);
}
.card3d .back { transform: rotateY(180deg); background-color: #2c1a0e; background-size: 100% 100%; border: 3px solid #a7823f; box-shadow: 0 6px 14px rgba(0,0,0,.5); }
.card3d .label { width: 100%; text-align: center; font-size: 16px; line-height: 1.2; font-weight: 700; letter-spacing: .08em; padding: 12px 8px 0; }
.card3d .label small { display: block; font-size: 16px; font-weight: 400; letter-spacing: .02em; opacity: .75; }
.card3d .math { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 10px; overflow: hidden; }
.card3d .math .katex { font-size: 26px; }
.card3d .math .katex-display { margin: 0; }
.card3d .foot { width: 100%; text-align: center; font-size: 16px; padding: 0 12px 14px; line-height: 1.25; }
.card3d .stars { color: #9b2c16; letter-spacing: .1em; }
.card3d.kind-target .front { border-color: #7a2f17; }
.card3d.kind-func .front { border-color: #3c4f63; }
.card3d.trap .math { } /* 陷阱卡同普通卡一樣，唔俾提示 */
.card3d .icon { width: 120px; height: 120px; margin: 4px auto 0; }
.card3d .icon svg { width: 100%; height: 100%; }
.card3d::after { content: ""; position: absolute; inset: 0; border-radius: 14px; pointer-events: none; opacity: 0; transition: opacity .15s; }
.card3d.sel .front { border-color: #f0b429; box-shadow: 0 0 0 4px #ffd36a, 0 0 26px 6px rgba(255,190,60,.9); }
.card3d.pick .front { border-color: #3fb5d8; box-shadow: 0 0 0 4px #8fe0ff, 0 0 22px 4px rgba(120,210,255,.85); }
.card3d.dim::after { background: rgba(15,8,2,.55); opacity: 1; }
.card3d.flash .front { box-shadow: 0 0 0 4px #fff, 0 0 40px 12px rgba(160,220,255,.95); }
body.lowfx .card3d .front, body.lowfx .card3d .back { box-shadow: none; }
body.lowfx .card3d.sel .front { box-shadow: 0 0 0 4px #ffd36a; }
body.lowfx .card3d.pick .front { box-shadow: 0 0 0 4px #8fe0ff; }

.pile3d { width: 200px; height: 280px; border-radius: 14px; pointer-events: none; background-size: 100% 100%;
  box-shadow: 4px 4px 0 #1a0f07, 8px 8px 0 #2a190c, 12px 12px 14px rgba(0,0,0,.6); border: 3px solid #a7823f; }
.pile3d .cnt { position: absolute; left: 50%; top: -52px; transform: translateX(-50%); white-space: nowrap; font-size: 30px; color: var(--parch); text-shadow: 0 2px 4px #000; }
.pile3d.empty { opacity: .25; }
.slot3d { width: 200px; height: 280px; border-radius: 14px; border: 3px dashed rgba(230,200,140,.35); pointer-events: none; }

.plate3d { width: 330px; padding: 12px 18px; border-radius: 16px; display: flex; align-items: center; gap: 14px; pointer-events: none;
  background: linear-gradient(180deg, rgba(48,30,14,.92), rgba(24,14,6,.92)); border: 2px solid var(--brass); color: var(--parch); font-size: 26px; }
.plate3d .emb { width: 64px; height: 64px; flex: none; }
.plate3d .nm { font-weight: 700; line-height: 1.1; }
.plate3d .sub { font-size: 20px; opacity: .8; }
.plate3d .sc { margin-left: auto; font-size: 40px; color: var(--gold-hi); }
.plate3d.active { border-color: var(--gold-hi); box-shadow: 0 0 24px rgba(255,200,90,.8); }
.plate3d .think { display: none; width: 44px; height: 44px; }
.plate3d.thinking .think { display: block; animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
#hud > * { pointer-events: auto; }
.panel { background: linear-gradient(180deg, rgba(40,25,12,.88), rgba(20,12,5,.9)); border: 1px solid rgba(212,165,72,.6); border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
#scoreboard { position: absolute; left: max(10px, env(safe-area-inset-left)); top: 10px; padding: 6px 10px; display: flex; flex-direction: column; gap: 3px; min-width: 9em; }
#scoreboard .row { display: flex; align-items: center; gap: .45em; padding: 2px 4px; border-radius: 6px; white-space: nowrap; }
#scoreboard .row.cur { background: rgba(255,200,90,.18); }
#scoreboard .row svg { width: 1.5em; height: 1.5em; flex: none; }
#scoreboard .row .s { margin-left: auto; color: var(--gold-hi); font-weight: 600; padding-left: .8em; }
#scoreboard .goal { font-size: .78em; opacity: .75; text-align: center; border-top: 1px solid rgba(212,165,72,.3); padding-top: 3px; }
#banner { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: min(56vw, 640px); padding: 7px 16px; text-align: center; line-height: 1.35; pointer-events: none; }
#banner .bi-en { font-size: .8em; opacity: .8; display: block; }
#topbtns { position: absolute; right: max(10px, env(safe-area-inset-right)); top: 10px; display: flex; gap: 6px; }
.iconbtn { width: 2.6em; height: 2.6em; display: grid; place-items: center; cursor: pointer; padding: 0; }
.iconbtn svg { width: 60%; height: 60%; fill: none; stroke: var(--parch); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn.off svg { opacity: .45; }
.iconbtn.on { border-color: var(--gold-hi); }
#actions { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: 12px; width: min(15em, 21vw); display: flex; flex-direction: column; gap: 7px; }
#selPreview { padding: 7px 9px; font-size: .9em; min-height: 3em; line-height: 1.3; text-align: center; }
#selPreview .katex { font-size: 1.05em; }
#selPreview .muted { opacity: .65; }
.btn { cursor: pointer; padding: .55em .8em; border-radius: 10px; border: 1px solid var(--brass); background: linear-gradient(180deg, #4a2f16, #2a190b); color: var(--parch); line-height: 1.15; text-align: center; transition: transform .08s, filter .15s; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: default; filter: grayscale(.6); }
.btn.primary { background: linear-gradient(180deg, #b2412a, #6f1d10); border-color: #f0b46a; font-size: 1.2em; font-weight: 700; letter-spacing: .08em; box-shadow: 0 0 14px rgba(255,120,60,.35); }
.btn.primary:not(:disabled) { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 22px rgba(255,150,70,.75); } }
.btn .bi-en, .bi-en { display: block; font-size: .72em; opacity: .8; font-weight: 400; letter-spacing: 0; }
.btn.gold { background: linear-gradient(180deg, #d9ad55, #8a6420); color: #23160a; border-color: #ffe3a0; font-weight: 700; }

#toast { position: fixed; left: 50%; top: 22%; transform: translate(-50%, -10px); z-index: 30; padding: 10px 18px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; text-align: center; max-width: 80vw; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.bad { border-color: #ff7b6b; }
#toast.good { border-color: #9be38b; }

/* ---------- 反應窗口 ---------- */
#reaction { position: fixed; z-index: 20; right: max(14px, env(safe-area-inset-right)); top: 12vh; width: min(15em, 21vw); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
#reaction .title { padding: 6px 10px; font-size: 1.05em; font-weight: 700; text-align: center; width: 100%; }
#reaction .title .sub { font-size: .8em; font-weight: 400; opacity: .9; display: block; }
#reactBtn { pointer-events: auto; position: relative; width: clamp(96px, 20vh, 160px); height: clamp(96px, 20vh, 160px); border-radius: 50%; border: 3px solid #ffe3a0; cursor: pointer;
  background: radial-gradient(circle at 40% 35%, #e0573a, #8c1a0c 70%, #4a0b04); color: #fff4dd; font-weight: 700; font-size: 1.15em; line-height: 1.15; box-shadow: 0 0 30px rgba(255,90,40,.7); }
#reactBtn:disabled { background: radial-gradient(circle at 40% 35%, #6d5a48, #3b2c20 70%); box-shadow: none; color: #cbb; cursor: default; }
#reactBtn svg.ring { position: absolute; inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px); transform: rotate(-90deg); pointer-events: none; }
#reactBtn svg.ring circle { fill: none; stroke: var(--gold-hi); stroke-width: 5; }
#reactBtn .count { display: block; font-size: 1.8em; }
#reaction.watch #reactBtn { display: none; }

/* ---------- 成功鍊成：原創剪影 cut-in ---------- */
#cutin { position: fixed; inset: 0; z-index: 32; pointer-events: none; overflow: hidden; }
#cutin .flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #fff, rgba(190,235,255,.85) 35%, rgba(255,255,255,0) 70%); animation: ciFlash .6s ease-out forwards; }
#cutin .band { position: absolute; left: -15%; right: -15%; top: 27%; height: 46%; transform: skewY(-7deg) translateX(-130%);
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 2px, transparent 2px 38px), linear-gradient(90deg, rgba(25,10,3,0), rgba(45,16,6,.94) 14%, var(--cc) 50%, rgba(45,16,6,.94) 86%, rgba(25,10,3,0));
  border-top: 4px solid var(--gold-hi); border-bottom: 4px solid var(--gold-hi); box-shadow: 0 0 40px rgba(255,200,90,.6); animation: ciBand 2.3s cubic-bezier(.2,.8,.2,1) forwards; }
#cutin .circ { position: absolute; left: 4%; top: 50%; width: min(52vh, 40vw); height: min(52vh, 40vw); transform: translateY(-50%); opacity: 0; animation: ciCirc 2.3s ease-out forwards; }
#cutin .circ svg { width: 100%; height: 100%; animation: spin 6s linear infinite; filter: drop-shadow(0 0 10px #9fe0ff); }
#cutin .fig { position: absolute; left: 9%; bottom: 14%; height: 72vh; transform: translateX(-60vw); animation: ciFig 2.3s cubic-bezier(.2,.9,.25,1) forwards; filter: drop-shadow(0 0 14px var(--c)); }
#cutin .fig svg { height: 100%; width: auto; }
#cutin .txt { position: absolute; right: 7%; top: 50%; transform: translate(60vw, -50%); text-align: right; color: #fff4dc; animation: ciTxt 2.3s cubic-bezier(.2,.9,.25,1) forwards; max-width: 52vw; }

<script type="module">
import * as THREE from 'three';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
/* =====================================================================
   LOGIC START — 純遊戲邏輯（唔掂 DOM / Three.js），可以獨立測試
   ===================================================================== */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const randRange = (r) => r[0] + Math.random() * (r[1] - r[0]);
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

/* ---------- 多項式：變數 x、y，整數係數 ---------- */
class Poly {
  constructor(entries) {
    this.t = new Map();                 // "i,j" -> 係數，代表 c·x^i·y^j
    if (entries) for (const [k, c] of entries) this._add(k, c);
  }
  _add(k, c) {
    if (!c) return;
    const v = (this.t.get(k) || 0) + c;
    if (v === 0) this.t.delete(k); else this.t.set(k, v);
  }
  static mono(c, i = 0, j = 0) { return new Poly([[i + ',' + j, c]]); }
  static const(c) { return Poly.mono(c, 0, 0); }
  static product(list) { return list.reduce((acc, p) => acc.mul(p), Poly.const(1)); }
  static parse(str) { return parseExpr(str); }
  clone() { return new Poly(this.t); }
  add(o) { const r = this.clone(); for (const [k, c] of o.t) r._add(k, c); return r; }
  neg() { return this.scale(-1); }
  sub(o) { return this.add(o.neg()); }
  scale(k) { const r = new Poly(); for (const [key, c] of this.t) r._add(key, c * k); return r; }
  mul(o) {
    const r = new Poly();
    for (const a of this.terms()) for (const b of o.terms()) r._add((a.i + b.i) + ',' + (a.j + b.j), a.c * b.c);
    return r;
  }
  pow(n) { let r = Poly.const(1); for (let i = 0; i < n; i++) r = r.mul(this); return r; }
  equals(o) {
    if (this.t.size !== o.t.size) return false;
    for (const [k, c] of this.t) if (o.t.get(k) !== c) return false;
    return true;
  }
  isZero() { return this.t.size === 0; }
  /* 項按次數高至低、x 次數高至低排列；第一項就係首項 */
  terms() {
    return [...this.t].map(([k, c]) => { const [i, j] = k.split(',').map(Number); return { i, j, c }; })
      .sort((A, B) => (B.i + B.j) - (A.i + A.j) || B.i - A.i);
  }
  leading() { return this.terms()[0] || { i: 0, j: 0, c: 0 }; }
  leadingCoeff() { return this.leading().c; }
  degree() { return this.terms().reduce((m, t) => Math.max(m, t.i + t.j), 0); }
  content() { let g = 0; for (const c of this.t.values()) g = gcd(g, c); return g; }
  isConstant() { return this.t.size === 0 || (this.t.size === 1 && this.t.has('0,0')); }
  constValue() { return this.t.get('0,0') || 0; }
  isMonomial() { return this.t.size === 1; }
  isLinear() { return this.degree() === 1; }
  isPrimitive() { return this.content() === 1 && this.leadingCoeff() > 0; }
  /* 如果 this = o × k（k 係整數）就回傳 k，否則 null */
  quotientConst(o) {

/* ---------- 遊戲狀態 ---------- */

/* ---------- 電腦 AI ---------- */
const AI = {
  /* 暴力搜尋手牌子集（最多用 1 張賢者之石） */
  findSyntheses(game, pi) {
    const hand = game.player(pi).hand.map(id => game.card(id));
    const factors = hand.filter(c => c.kind === 'factor');
    const stone = hand.find(c => c.kind === 'func' && c.func === 'stone');
    const out = [];
    const targets = game.table.map(t => game.card(t.id));
    const n = factors.length;
    for (let mask = 1; mask < (1 << n); mask++) {
      const sel = [];
      for (let b = 0; b < n; b++) if (mask & (1 << b)) sel.push(factors[b]);
      const P = Poly.product(sel.map(c => c.poly));
      for (const t of targets) {
        if (P.degree() !== t.poly.degree()) continue;
        if (P.equals(t.poly)) out.push(AI._pack(t, sel, false));
        else if (stone) { const k = t.poly.quotientConst(P); if (k !== null && k > 1) out.push(AI._pack(t, sel.concat(stone), true)); }

  },
  bestOption(opts, params) {

    const rank = (a, b) => b.stars - a.stars || (a.usesStone - b.usesStone) || (b.cardIds.length - a.cardIds.length);
    if (incomplete.length && Math.random() < params.sloppy) return incomplete.sort(rank)[0];
    if (correct.length && Math.random() >= params.missSynth) return correct.sort(rank)[0];
    return null;
  },
  /* 試吓用逆鍊成可唔可以多出一個正確合成 */
  findReverse(game, pi) {
    const p = game.player(pi);
    const rev = p.hand.find(id => game.card(id).kind === 'func' && game.card(id).func === 'reverse');
    if (!rev) return null;
    const hasNow = AI.findSyntheses(game, pi).some(o => o.result === 'correct');
    if (hasNow) return null;
    for (const id of p.hand) {
      const c = game.card(id);
      if (!game.canReverse(c) || c.trap) continue;
      const old = c.poly; c.poly = old.flipSigns();
      const ok = AI.findSyntheses(game, pi).some(o => o.result === 'correct');
      c.poly = old;
      if (ok) return { funcId: rev, cardId: id };
    }
    return null;
  },
  /* 卡牌有幾有用（用嚟決定棄邊張） */
  utility(game, card, params) {
    if (card.kind === 'func') return { hand: 6, stone: 5, reverse: 3 }[card.func];
    let u = card.trap ? (params.sloppy > 0.2 ? 0.6 : 0) : 0.3;

    const hand = game.player(pi).hand.slice();
    const scored = hand.map(id => ({ id, u: AI.utility(game, game.card(id), params) }));
    if (Math.random() > params.smartDiscard) shuffle(scored); else scored.sort((a, b) => a.u - b.u);
    return scored.slice(0, n).map(s => s.id);
  },
  shouldSwap(game, pi, params) {
    const hand = game.player(pi).hand;
    return hand.some(id => AI.utility(game, game.card(id), params) < 1);
  },
  /* 反應窗口：決定打唔打分解之手 */
  decideHand(game, pi, synthPi, targetId, params) {
    const p = game.player(pi);
    const handId = p.hand.find(id => game.card(id).kind === 'func' && game.card(id).func === 'hand');
    if (!handId) return null;
    const stars = game.card(targetId).stars;
    const danger = game.player(synthPi).score + game.cfg.points[stars] >= game.cfg.winScore;
    const prob = danger ? Math.max(params.handUse, 0.9) : params.handUse * (0.4 + stars * 0.2);
    return Math.random() < prob ? { cardId: handId, delay: randRange(params.handDelay) } : null;
  },
  decideSnipe(game, pi, ev, params) {
    const p = game.player(pi);
    const ok = p.hand.map(id => game.card(id)).filter(c => snipeValid(c, ev));
    if (!ok.length) return null;
    ok.sort((a, b) => (a.kind === 'func') - (b.kind === 'func'));   // 盡量唔用賢者之石
    return Math.random() < params.snipeChance ? { cardId: ok[0].id, delay: randRange(params.snipeDelay) } : null;
  },
};

      case 'warn': [0, 0.18].forEach(a => this.tone(880, 0.14, { at: a, type: 'square', vol: 0.09 })); break;

  buildDust() {

    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

  }

  /* ---------- 主迴圈 ---------- */
  frame() {
    const dt = Math.min(this.clock.getDelta(), 0.1), time = this.clock.elapsedTime;
    this.frameTimes.push(dt); if (this.frameTimes.length > 120) this.frameTimes.shift();
    // 燭光閃爍

      const fl = this.lowfx ? 1 : 0.85 + 0.15 * Math.sin(time * 9 + f.seed) * Math.sin(time * 5.3 + f.seed * 2);
      f.flame.scale.set(30 * fl, 60 * (0.9 + 0.2 * fl), 1);
      f.halo.material.opacity = 0.6 + 0.25 * fl;
    });
    this.lights.forEach((L, n) => { L.intensity = this.lowfx ? 1 : 0.9 + 0.18 * Math.sin(time * 8 + n * 3) * Math.sin(time * 3.1 + n); });
    if (this.dust && this.dust.visible) { this.dust.rotation.z = Math.sin(time * 0.05) * 0.05; this.dust.position.z = Math.sin(time * 0.3) * 20; }
    // 鍊成陣發光
    this.glow += (this.glowTarget - this.glow) * Math.min(1, dt * 5);
    this.circleGlow.material.opacity = this.glow * (0.75 + 0.25 * Math.sin(time * 12));
    this.circleGlow.rotation.z += dt * this.glow * 0.8;
    this.circleLight.intensity = this.glow * 2.2;
    // 補間動畫
    for (const [obj, tw] of this.tweens) {
      tw.t += dt * 1000;
      const k = Math.min(1, Math.max(0, tw.t) / tw.dur), e = tw.ease(k);
      obj.position.lerpVectors(tw.p0, tw.p1, e);
      obj.rotation.set(tw.r0.x + (tw.r1.x - tw.r0.x) * e, tw.r0.y + (tw.r1.y - tw.r0.y) * e, tw.r0.z + (tw.r1.z - tw.r0.z) * e);
      const s = tw.s0 + (tw.s1 - tw.s0) * e; obj.scale.set(s, s, s);
      if (tw.arc) obj.position.z += Math.sin(Math.PI * k) * tw.arc;
      if (k >= 1) { this.tweens.delete(obj); tw.resolve(); }
      this.cssDirty = true;
    }
    // 特效
    if (this.fxItems.length) this.fxItems = this.fxItems.filter(f => f.update(dt, time));
    this.renderer.render(this.scene, this.camera);
    if (this.cssDirty) { this.css.render(this.cssScene, this.camera); this.cssDirty = false; }
    if (this.fxScene.children.length || this.fxWasActive) {

  /* ---------- 卡牌 DOM ---------- */

  createCard(card) {

    const obj = new CSS3DObject(el);
    obj.visible = false;

  renderFace(card) {
    const rec = this.objs.get(card.id); if (!rec) return;
    const front = rec.el.querySelector('.front');
    const label = (zh, en) => LANG === 'bi' ? `${zh}<small>${en}</small>` : (LANG === 'en' ? en : zh);
    let html = '';
    if (card.kind === 'target') {
      const s = '★'.repeat(card.stars);
      html = `<div class="label">${label('目標', 'Target')} <span class="stars">${s}</span></div><div class="math"></div><div class="foot">+${CFG.points[card.stars]}</div>`;
    } else if (card.kind === 'factor') {
      const p = card.poly;
      const kindLbl = p.isConstant() ? label('常數', 'Constant') : p.isMonomial() ? label('單項式', 'Monomial') : label('一次因式', 'Linear factor');
      html = `<div class="label">${kindLbl}</div><div class="math"></div><div class="foot">&nbsp;</div>`;
    } else {
      html = `<div class="label">${t(card.func)}</div><div class="icon">${ART.funcIcon(card.func)}</div><div class="foot">${t(card.func + 'Rule')}</div>`;
    }
    front.innerHTML = html;
    const m = front.querySelector('.math');
    if (m) {
      const src = card.kind === 'target' ? card.poly.toTeX() : cardTeX(card);
      m.innerHTML = tex(src);
      // 太長就喺中間嘅 +/− 斷行（字體大小保持統一）
      if (card.kind === 'target' && card.poly.t.size >= 4) {
        const ts = card.poly.terms(); const half = Math.ceil(ts.length / 2);
        const a = new Poly(ts.slice(0, half).map(x => [x.i + ',' + x.j, x.c])).toTeX();
        const bTerms = ts.slice(half); const b = new Poly(bTerms.map(x => [x.i + ',' + x.j, x.c])).toTeX();
        const bSigned = bTerms[0].c < 0 ? b : '+ ' + b;

  }
  refreshAllFaces() { for (const { card } of this.objs.values()) this.renderFace(card); }

  /* ---------- 版面 ---------- */

  updatePlates(game) {

  }
  setThinking(i, on) { if (this.plates && this.plates[i]) { this.plates[i].el.classList.toggle('thinking', on); } }
  updatePileCounts(game) {

  /* 根據遊戲狀態計每張卡應該喺邊，然後補間過去 */
  layout(game, ui, dur = 420) {
    const L = this.L, human = 0, proms = [];
    const want = new Map();
    const staged = ui.staged;
    const stagedSet = new Set(staged ? staged.cardIds.concat([staged.targetId]) : []);
    // 真人手牌
    const hand = game.player(human).hand.filter(id => !stagedSet.has(id));
    const n = hand.length, spacing = Math.min(132, 1200 / Math.max(n, 1)), hs = n >= 10 ? 0.8 : 0.84;
    hand.forEach((id, i) => {
      const off = i - (n - 1) / 2;
      const sel = ui.selected.has(id) || ui.pick === id;
      const hov = this.hoverId === id && ui.interactive;
      want.set(id, {
        x: L.handCenter.x + off * spacing, y: L.handCenter.y - off * off * 4 + (sel ? 46 : 0) + (hov ? 18 : 0),
        z: L.handCenter.z + i * 0.6 + (sel ? 70 : 0) + (hov ? 40 : 0), rx: 0.55, rz: -off * 0.035, s: hs * (sel ? 1.12 : hov ? 1.08 : 1), up: true,
      });
    });
    // 電腦手牌（背面）
    for (let pi = 1; pi < game.players.length; pi++) {
      const seat = L.seats[pi].hand; const h = game.player(pi).hand.filter(id => !stagedSet.has(id)); const m = h.length;
      h.forEach((id, i) => {
        const off = i - (m - 1) / 2;
        if (seat.dir === 'h') want.set(id, { x: seat.x + off * 52, y: seat.y - Math.abs(off) * 3, z: 10 + i * 0.5, rz: -off * 0.04, s: 0.5, up: false });
        else want.set(id, { x: seat.x - Math.abs(off) * 3 * seat.side, y: seat.y + off * 40, z: 10 + i * 0.5, rz: seat.side * Math.PI / 2 + off * 0.04, s: 0.48, up: false });
      });
    }
    // 桌面目標
    game.table.forEach((tt, i) => {
      if (stagedSet.has(tt.id)) return;
      const p = L.table(i, game.cfg.tableSize), sel = ui.selectedTarget === tt.id, hov = this.hoverId === tt.id && ui.interactive;
      want.set(tt.id, { ...p, s: p.s * (sel ? 1.2 : hov ? 1.06 : 1), z: sel ? 90 : hov ? 30 : 4, y: p.y - (sel ? 30 : 0), rx: sel ? 0.4 : p.rx, up: true });
    });
    // 已得分目標（細張疊起）
    game.players.forEach((p, pi) => {
      const sc = L.seats[pi].scored;
      p.scored.forEach((id, k) => want.set(id, { x: sc.x + k * 16, y: sc.y - k * 6, z: sc.z + k * 1.2, rx: sc.rx || 0, rz: -0.08 + k * 0.03, s: 0.42, up: true }));
    });
    // 棄牌堆：最頂兩張
    const dp = game.discardPile;
    dp.slice(-2).forEach((id, k, arr) => want.set(id, { ...L.discard, z: L.discard.z + k * 2, rz: (id.charCodeAt(id.length - 1) % 7 - 3) * 0.03, up: true, s: 1 }));
    // 合成中
    if (staged) {
      want.set(staged.targetId, { ...L.stageTarget, up: true });
      const m = staged.cardIds.length;
      staged.cardIds.forEach((id, i) => {
        const off = i - (m - 1) / 2;
        want.set(id, { x: CIRCLE.x + off * 175, y: CIRCLE.y - 150 - Math.abs(off) * 14, z: 150 + i, rx: 0.45, rz: -off * 0.06, s: 0.8, up: true });
      });
    }
    this.lastWant = new Set(want.keys());
    let newcomer = 0;
    for (const [id, rec] of this.objs) {
      const w = want.get(id);
      if (!w) {
        if (rec.obj.visible) {
          // 去返牌堆（棄牌堆底、洗返入抽牌堆、目標牌堆）再收埋
          const dest = game.discardPile.includes(id) ? { ...L.discard, ry: 0 } : game.targetDeck.includes(id) ? { ...L.targetDeck } : { ...L.drawPile };
          if (this.same(rec.obj, dest)) this.hideIfUnwanted(id);
          else if (!this.sameTarget(rec.obj, dest)) proms.push(this.tween(rec.obj, dest, dur, easeOut).then(() => this.hideIfUnwanted(id)));
        }

      }
      const to = { ...w, ry: w.up ? 0 : Math.PI };
      if (!rec.obj.visible || !rec.placed) {
        const origin = rec.respawn ? { ...L.stageTarget, s: 0.05, ry: 0 } : { ...(rec.card.kind === 'target' ? L.targetDeck : L.drawPile), ry: Math.PI, s: 1 };
        rec.respawn = false;
        this.setNow(rec.obj, origin);
        rec.obj.visible = true; rec.placed = true;
        const delay = newcomer++ * 75;
        proms.push(this.tween(rec.obj, to, dur + 120, easeInOut, 160, delay));
        setTimeout(() => Sound.play('deal'), delay);
      } else if (!this.same(rec.obj, to) && !this.sameTarget(rec.obj, to)) {
        proms.push(this.tween(rec.obj, to, dur, easeOut, 0));
      }
    }
    this.updatePileCounts(game);
    this.updatePlates(game);
    this.cssDirty = true;
    return Promise.all(proms);
  }
  hideIfUnwanted(id) {
    const rec = this.objs.get(id);

  }
  sameTarget(obj, to) {
    const tw = this.tweens.get(obj); if (!tw) return false;
    const a = tw.to;
    return ['x', 'y', 'z'].every(k => Math.abs((a[k] || 0) - (to[k] || 0)) < 0.5) && ['rx', 'ry', 'rz'].every(k => Math.abs((a[k] || 0) - (to[k] || 0)) < 0.01) && Math.abs((a.s || 1) - (to.s || 1)) < 0.01;
  }
  same(obj, to) {
    const p = obj.position, r = obj.rotation;
    return Math.abs(p.x - to.x) < 0.5 && Math.abs(p.y - to.y) < 0.5 && Math.abs(p.z - to.z) < 0.5 &&
      Math.abs(r.x - (to.rx || 0)) < 0.01 && Math.abs(r.y - (to.ry || 0)) < 0.01 && Math.abs(r.z - (to.rz || 0)) < 0.01 && Math.abs(obj.scale.x - (to.s || 1)) < 0.01;
  }
  worldOf(id) { const r = this.objs.get(id); return r ? r.obj.position.clone() : new THREE.Vector3(); }

  /* ---------- 特效 ---------- */
  setGlow(v) { this.glowTarget = v; }
  async flip(id) {
    const r = this.objs.get(id); if (!r) return;
    const o = r.obj; const base = { x: o.position.x, y: o.position.y, z: o.position.z, rx: o.rotation.x, rz: o.rotation.z, s: o.scale.x };
    Sound.play('flip');
    await this.tween(o, { ...base, ry: Math.PI / 2, z: base.z + 60 }, 160, easeOut);
    this.renderFace(r.card);
    await this.tween(o, { ...base, ry: 0 }, 180, easeOut);
  }
  lightning(ms = 1200) {
    if (this.lowfx) return;
    const group = new THREE.Group(); this.fxScene.add(group);
    const mat = new THREE.MeshBasicMaterial({ color: 0xbfeaff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
    const mat2 = new THREE.MeshBasicMaterial({ color: 0x4fb8ff, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
    let acc = 0, life = 0;
    const bolt = () => {
      const a0 = Math.random() * Math.PI * 2, a1 = a0 + (Math.random() - 0.5) * 2.4;
      const r0 = CIRCLE.r * (0.3 + Math.random() * 0.75), r1 = CIRCLE.r * (0.3 + Math.random() * 0.75);
      const A = new THREE.Vector3(CIRCLE.x + Math.cos(a0) * r0, CIRCLE.y + Math.sin(a0) * r0, 10 + Math.random() * 30);
      const B = new THREE.Vector3(CIRCLE.x + Math.cos(a1) * r1, CIRCLE.y + Math.sin(a1) * r1, 60 + Math.random() * 140);
      const pts = [A]; const seg = 12;
      for (let i = 1; i < seg; i++) {
        const p = A.clone().lerp(B, i / seg);
        p.x += (Math.random() - 0.5) * 50; p.y += (Math.random() - 0.5) * 50; p.z += (Math.random() - 0.5) * 30; pts.push(p);
      }
      pts.push(B);
      const ribbon = (w) => {
        const pos = [];
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[i], b = pts[i + 1], d = b.clone().sub(a); const nrm = new THREE.Vector3(-d.y, d.x, 0).normalize().multiplyScalar(w * (1 - i / pts.length * 0.6));
          pos.push(a.x - nrm.x, a.y - nrm.y, a.z, a.x + nrm.x, a.y + nrm.y, a.z, b.x + nrm.x, b.y + nrm.y, b.z, a.x - nrm.x, a.y - nrm.y, a.z, b.x + nrm.x, b.y + nrm.y, b.z, b.x - nrm.x, b.y - nrm.y, b.z);
        }
        const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); return g;
      };
      const m1 = new THREE.Mesh(ribbon(2.2), mat), m2 = new THREE.Mesh(ribbon(8), mat2);
      group.add(m1, m2);
      return [m1, m2];
    };
    const live = [];
    this.fxItems.push({
      update: (dt) => {
        life += dt * 1000; acc += dt * 1000;
        if (acc > 70 && life < ms) {
          acc = 0;
          while (live.length > 6) { const m = live.shift(); group.remove(m); m.geometry.dispose(); }
          live.push(...bolt(), ...(Math.random() < 0.5 ? bolt() : []));
          if (Math.random() < 0.4) Sound.play('zap');
        }
        if (life >= ms) {
          mat.opacity -= dt * 4; mat2.opacity -= dt * 3;

        }
        return true;

    });
  }
  sparks(pos, color = 0xffd27a, n = 70) {
    if (this.lowfx) n = 18;
    const P = new Float32Array(n * 3), V = [];
    for (let i = 0; i < n; i++) {
      P[i * 3] = pos.x; P[i * 3 + 1] = pos.y; P[i * 3 + 2] = pos.z;
      const a = Math.random() * Math.PI * 2, e = Math.random() * 1.2, sp = 250 + Math.random() * 450;

  let abort; const abortP = new Promise((_, rej) => { abort = () => rej(new AbortGame()); });
  abortP.catch(() => {});
  session = {

    settings: { ...setupSel }, rules, mode, place: mode, start: new Date(), active: true, finished: false, abort, abortP,
    tries: new Map(), t0: new Map(), hinted: new Set(), wasNb: new Map(), firstCount: 0, bellsEarned: 0, fixedCount: 0,
    hintsLeft: CFG.hintsPerGame, lowfxChecked: false,

    attempts: [], mistakes: [], claimed: new Map(), endReason: '',

  // 重新建立 3D 卡牌
  for (const { obj } of view.objs.values()) view.cssScene.remove(obj);
  view.objs.clear();
  for (const c of game.cards.values()) view.createCard(c);
  view.buildLayout(game.players.length);

  resetUI();
  hideAllScreens(); $('hud').hidden = false;

  for (const i of order) {
    const c = CHARACTERS[game.player(i).char];
    const line = LANG === 'en' ? `“${c.line[1]}”` : LANG === 'bi' ? `「${c.line[0]}」<span class="bi-en">${c.line[1]}</span>` : `「${c.line[0]}」`;
    sp.innerHTML = `${ART.symbol(game.player(i).char)}<div><div class="who">${charNameHTML(game.player(i).char)}</div><div class="line">${line}</div></div>`;
    sp.classList.add('show'); Sound.play('flip');
    await wait(i === 0 ? 1700 : 2300);
    sp.classList.remove('show'); await wait(260);
  }
}

/* ---------- 主迴圈 ---------- */
async function runLoop() {
  while (!game.over && session.active) {
    const pi = game.current;
    renderScoreboard(); view.updatePlates(game);
    if (game.player(pi).isHuman) await humanTurn(); else await aiTurn(pi);
    renderScoreboard();
    if (game.over) break;
    const gate = game.endTurn();
    if (gate) {
      banner(t('truthGate'));
      view.setGlow(0.4);
      await abortable(view.gate());
      view.setGlow(0);
      await relayout(500);
    }
  }
  if (session && session.active) await finishGame();
}
async function drawCards(pi, n) {
  if (isSimple()) {
    n = Math.min(n, game.cfg.handLimit - game.player(pi).hand.length);
    if (n <= 0) { if (game.player(pi).isHuman) toast(t('handFull', { n: game.cfg.handLimit })); return []; }
  }
  const r = game.draw(pi, n);
  if (r.reshuffled) toast(t('reshuffle'));
  await relayout(460);
  return r.got;
}

/* ---------- 真人回合 ---------- */
function waitAction() { return abortable(new Promise(res => { actionResolver = res; })); }
function act(a) { if (actionResolver) { const r = actionResolver; actionResolver = null; r(a); } }
const turnBanner = () => banner(t(isSimple() ? 'yourTurnSimple' : 'yourTurn'));
async function humanTurn() {
  turnBanner();
  session.t0 = new Map();                 // 每個回合重新計：揀目標卡嗰刻開始計時
  if (session.mode !== 'notebook') await drawCards(0, 1);
  ui.interactive = true; ui.mode = 'main';
  updateButtons(); renderPreview();
  for (;;) {
    const a = await waitAction();
    if (a.type === 'reverse') {
      ui.interactive = false; updateButtons();
      ui.mode = 'main'; view.setClass(a.funcId, 'pick', false); ui.reverseFunc = null;
      const c = game.card(a.cardId), before = c.poly;
      game.reverse(0, a.funcId, a.cardId);
      ui.selected.delete(a.funcId);
      await relayout(300);
      await abortable(view.flip(a.cardId));
      toast(t('reverseDone', { a: tex(par(before)), b: tex(par(c.poly)) }), 'good');
      ui.interactive = true;
      turnBanner(); updateButtons(); renderPreview();
      continue;
    }
    if (a.type === 'skill') {
      ui.interactive = false; updateButtons();
      await useSkill();
      ui.interactive = true; ui.mode = 'main';
      turnBanner(); updateButtons(); renderPreview(); relayout(200).catch(() => {});
      continue;
    }
    ui.interactive = false; updateButtons();
    if (a.type === 'synth') {
      const r = await resolveSynthesis(0, a.targetId, a.cardIds);
      if (r === 'retry') {                // 答錯唔扣分，讀完提示可以再試
        ui.interactive = true; ui.mode = 'main';
        turnBanner(); updateButtons(); renderPreview(); relayout(200).catch(() => {});
        continue;
      }
    } else if (a.type === 'swap') {
      ui.selected.clear();
      game.discard(0, [a.cardId]);
      await relayout(380);
      await drawCards(0, 1);
    }
    break;
  }
  ui.selected.clear(); ui.selectedTarget = null; ui.mode = 'idle';
  await enforceHandLimit(0);
  updateButtons(); renderPreview();
}
async function enforceHandLimit(pi) {
  while (game.player(pi).hand.length > game.cfg.handLimit) {
    if (game.player(pi).isHuman) {
      const id = await chooseDiscard(t('handLimit', { n: game.cfg.handLimit }));
      game.discard(0, [id]);
    } else game.discard(pi, AI.pickDiscard(game, pi, CFG.ai[game.player(pi).difficulty]));
    await relayout(360);
  }
}
async function chooseDiscard(msg) {
  const prevMode = ui.mode;
  ui.mode = 'discard'; ui.pick = null; ui.selected.clear(); ui.selectedTarget = null;
  banner(msg); updateButtons(); await relayout(200);
  const a = await waitAction();
  ui.mode = prevMode; ui.pick = null; updateButtons();
  return a.cardId;
}

/* ---------- 夥伴技能（每局有限次數） ---------- */
async function useSkill() {
  const k = session.partner, sk = PARTNERS[k].skill, me = game.player(0), sel = [...ui.selected];
  const full = () => isSimple() && me.hand.length >= game.cfg.handLimit;
  const used = () => { session.skillLeft--; Sound.play('clap'); banner(t('skillUsed', { name: charName(k), s: tp('skill_' + sk) })); };
  if (sk === 'eye') {
    if (!ui.selectedTarget) { toast(t('needTarget')); return; }
    const tg = game.card(ui.selectedTarget);
    used(); session.hinted.add(tg.id);
    logEvent('hint', { qid: qidOf(tg), topic: topicOf(tg) });
    toast(t('hintText', { m: t(methodOf(tg)) }), 'good', 3800);
    return;
  }
  if (sk === 'swap' || sk === 'burn') {
    if (sel.length !== 1) { toast(t('needOneCard')); return; }
    used(); ui.selected.clear(); game.discard(0, sel);
    await relayout(320);
    await drawCards(0, sk === 'swap' ? 1 : 2);
    return;
  }
  if (sk === 'flip') {
    const c = sel.length === 1 ? game.card(sel[0]) : null;
    if (!c || !game.canReverse(c)) { toast(t('needLinear')); return; }
    used(); const before = c.poly; c.poly = c.poly.flipSigns(); ui.selected.clear();
    await relayout(250);
    await abortable(view.flip(c.id));
    toast(t('reverseDone', { a: tex(par(before)), b: tex(par(c.poly)) }), 'good');
    return;
  }
  if (full()) { toast(t('handFull', { n: game.cfg.handLimit })); return; }
  if (sk === 'draw2') { used(); await drawCards(0, 2); return; }
  if (sk === 'peek') {
    const top = [];
    for (let i = 0; i < 2; i++) {
      if (!game.drawPile.length && game.discardPile.length) game.drawPile = shuffle(game.discardPile.splice(0));
      if (game.drawPile.length) top.push(game.drawPile.pop());
    }
    if (!top.length) { toast(t('skillNoCards')); return; }
    used();
    const keep = top.length === 1 ? top[0] : await chooseCard(top[0], top[1]);
    top.filter(id => id !== keep).forEach(id => game.drawPile.unshift(id));   // 另一張放返抽牌堆底
    me.hand.push(keep);
    await relayout(420);
  }
}
function chooseCard(a, b) {
  return abortable(new Promise(res => {
    const lbl = (id) => { const c = game.card(id); return c.kind === 'factor' ? tex(cardTeX(c)) : t(c.func); };

    $('btnYes').onclick = () => close(a); $('btnNo').onclick = () => close(b);
  }));
}

/* ---------- 電腦回合 ---------- */
async function aiTurn(pi) {
  const P = CFG.ai[game.player(pi).difficulty];
  banner(t('aiTurn', { name: nameOf(pi) }) + ` <i style="opacity:.75">${tp('thinking')}</i>`);
  await drawCards(pi, 1);
  view.setThinking(pi, true);
  await wait(randRange(CFG.aiThinkMs));
  view.setThinking(pi, false);
  const rv = AI.findReverse(game, pi);
  if (rv && Math.random() < P.useReverse) {
    game.reverse(pi, rv.funcId, rv.cardId);
    view.renderFace(game.card(rv.cardId));
    toast(`${nameOf(pi)}：${t('reverse')}`);
    await relayout(380); await wait(500);
  }
  const opt = AI.bestOption(AI.findSyntheses(game, pi), P);
  if (opt) await resolveSynthesis(pi, opt.targetId, opt.cardIds);
  else if (AI.shouldSwap(game, pi, P)) {
    game.discard(pi, AI.pickDiscard(game, pi, P));
    await relayout(380);
    await drawCards(pi, 1);
  }
  await enforceHandLimit(pi);
}

/* ---------- 合成判定流程 ---------- */
/* ---------- 學生作答：記錄 + 獎勵（答錯唔扣分；第三次先答對冇獎勵） ---------- */
const topicOf = (target) => STR[levelOf(target)][0];
function humanAnswer(target, ev) {
  const qid = qidOf(target), ok = ev.result === 'correct';
  const attempt = (session.tries.get(target.id) || 0) + 1;
  session.tries.set(target.id, attempt);
  const first = ok && attempt === 1;
  // review = 錯題本重做：錯題本練習，或者呢題喺今局第一次出手之前已經喺錯題本
  if (!session.wasNb.has(target.id)) session.wasNb.set(target.id, inNotebook(qid));
  const review = session.mode === 'notebook' || session.wasNb.get(target.id);
  let fixed = false, bells = 0, bonus = 0, levelUp = 0;
  if (ok) {
    // 錯題本練習只有「改正」獎勵；對戰入面第一次 300、第二次 150、第三次或以後冇獎勵
    bells = session.mode === 'notebook' ? 0 : attempt === 1 ? CFG.rewards.first : attempt === 2 ? CFG.rewards.second : 0;
    if (first && review) {
      state.notebook = state.notebook.filter(n => n.id !== qid);
      if (!state.fixedIds[qid]) { state.fixedIds[qid] = true; state.fixed++; fixed = true; bells += CFG.rewards.fixed; session.fixedCount++; }
    }
    // 夥伴：第一或第二次答對加經驗值；擅長屬性嘅題目有額外鈴錢
    if (attempt <= 2 && session.mode !== 'notebook' && session.partner) {
      const k = session.partner, before = partnerLevel(k);
      state.partners[k] = { xp: partnerXp(k) + 1 };
      const after = partnerLevel(k);
      if (after > before) { levelUp = after; session.skillLeft += Math.max(0, (CFG.partnerSkillUses[after - 1] || 0) - (CFG.partnerSkillUses[before - 1] || 0)); }
      if (PARTNERS[k].type === levelOf(target)) { bonus = CFG.partnerTypeBonus[before - 1] || 0; bells += bonus; }
    }
    if (first) session.firstCount++;
    state.bells += bells; session.bellsEarned += bells; save();
  } else {
    addNotebook(qid);
    session.stats[ev.result === 'wrong' ? 'wrong' : 'incomplete']++;
  }
  const t0 = session.t0.get(target.id) || Date.now();
  logEvent('answer', { place: session.place, qid, topic: topicOf(target), ok, attempt, first, hint: session.hinted.has(target.id),
    secs: Math.min(600, Math.round((Date.now() - t0) / 1000)),   // 由揀目標卡（或者按「我明白了」）計起
    review, fixed });
  return { attempt, first, bells, fixed, bonus, levelUp };
}
/* 答錯：先讀提示，按「我明白了」先可以再揀 */
function showTip(html) {
  return abortable(new Promise(res => {
    const prev = ui.mode; ui.mode = 'tip'; updateButtons();
    $('tipTitle').innerHTML = t('tipTitle'); $('tipBody').innerHTML = html;
    $('btnUnderstood').innerHTML = t('understood'); $('tipSaved').innerHTML = t('tipSaved');
    $('tipPanel').hidden = false;
    $('btnUnderstood').onclick = () => { Sound.play('select'); $('tipPanel').hidden = true; ui.mode = prev; res(); };
    session.abortP.catch(() => { $('tipPanel').hidden = true; });
  }));
}
function mistakeTip(target, ev) {
  const lv = levelOf(target);
  const firstStep = methodOf(target).endsWith('Common') || (lv === 'group' && target.answer.some(f => f.isConstant())) ? `<br>${t('mtip_first')}` : '';
  if (ev.result === 'incomplete') {
    const bad = ev.bad[0].poly, g = bad.content();
    const q = new Poly(bad.terms().map(x => [x.i + ',' + x.j, x.c / g]));
    return t('tipIncomplete', { f: tex(par(bad)), g, q: tex(par(q)) });
  }
  return t('tipWrong', { p: tex(ev.product.toTeX()), t: tex(target.poly.toTeX()) }) + `<br>${t('mtip_' + lv)}${firstStep}`;
}

async function resolveSynthesis(pi, targetId, cardIds) {
  const human = pi === 0, target = game.card(targetId);
  const ev = game.evaluate(targetId, cardIds);
  const ans = human ? humanAnswer(target, ev) : null;
  ui.selected.clear(); ui.selectedTarget = null; renderPreview();
  ui.staged = { targetId, cardIds };
  game.table.forEach(tt => { if (tt.id !== targetId) view.setClass(tt.id, 'dim', true); });
  banner(`${nameOf(pi)}：${t('synth')}`);
  await relayout(560);
  Sound.play('clap'); await wait(160);
  view.setGlow(1); Sound.play('charge'); view.lightning(1250);
  await wait(1300);
  const undim = () => view.clearClasses('dim');

  // 學生答錯（乘積錯或者唔夠簡）：唔扣分、卡退返手上，讀完提示再試
  if (human && ev.result !== 'correct') {
    view.setGlow(0); Sound.play(ev.result === 'wrong' ? 'fail' : 'warn');
    banner(t(ev.result === 'wrong' ? 'wrongTitle' : 'snipeTitle'));
    ui.staged = null; undim();
    await relayout(450);
    session.mistakes.push(ev.result === 'wrong'
      ? { kind: 'wrong', target, cards: cardIds.map(id => game.card(id)), product: ev.product }
      : { kind: 'incomplete', target, cards: cardIds.map(id => game.card(id)), bad: ev.bad[0].poly });
    await showTip(mistakeTip(target, ev));
    session.t0.set(targetId, Date.now());          // 按「我明白了」之後重新計時
    return 'retry';
  }

  if (ev.result === 'wrong') {                     // 電腦答錯（進階玩法要棄牌）
    view.setGlow(0); Sound.play('fail');
    banner(`${t('wrongTitle')}`);
    ui.staged = null; undim();
    await relayout(450);
    if (!isSimple()) { await wait(900); game.discard(pi, AI.pickDiscard(game, pi, CFG.ai[game.player(pi).difficulty])); await relayout(380); }
    return 'done';
  }

  if (ev.result === 'correct') {
    const proof = cardIds.map(id => game.card(id)).map(c => c.kind === 'factor' ? c.poly : Poly.const(ev.stoneValue));
    const stoneShown = ev.stoneValue && ev.stoneValue > 1 ? ev.stoneValue : null;
    // 錯題本練習／第三次或以後先答對：清走目標，唔計分、冇鈴錢
    if (human && (session.mode === 'notebook' || ans.attempt >= 3)) {
      game.discard(pi, cardIds);
      if (session.mode === 'notebook') game.table = game.table.filter(tt => tt.id !== targetId); else game.retire(targetId);
      ui.staged = null; undim(); view.setGlow(0);
      Sound.play('success'); view.successFx();
      banner(ans.attempt >= 3 ? t('thirdNote') : ans.fixed ? t('fixedNote') : t('correctPractice'));
      const lay = relayout(620);
      renderScoreboard();
      await cutIn(pi, target, ans);
      await lay;
      await showVerify(pi, target, proof, stoneShown);
      return 'done';
    }
    view.setGlow(0.55);
    banner(human ? t('waitReact') : t('handTitle', { name: nameOf(pi) }));
    const react = isSimple() ? null : await reactionWindow('hand', pi, targetId, ev);
    if (react) {
      banner(t('destroyedBy', { name: nameOf(react.pi) }));
      game.discard(react.pi, [react.cardId]);
      view.setGlow(1);
      await abortable(view.shatter(targetId));
      view.objs.get(targetId).respawn = true;
      game.discard(pi, cardIds);
      ui.staged = null; undim(); view.setGlow(0);
      await relayout(520);
      await drawCards(pi, cardIds.length);
      if (human) session.stats.destroyed++;
      await wait(500);
      return 'done';
    }
    game.discard(pi, cardIds);
    game.award(pi, targetId);
    session.claimed.set(targetId, pi);
    ui.staged = null; undim(); view.setGlow(0);
    Sound.play('success'); view.successFx();
    banner(t('scored', { name: nameOf(pi), p: CFG.points[target.stars] }));
    const lay = relayout(620);
    renderScoreboard();
    await cutIn(pi, target, ans);
    await lay;
    if (human) session.stats.succ[target.stars]++;
    await showVerify(pi, target, proof, stoneShown);
    return 'done';
  }

  // 電腦交出「正確但唔最簡」
  Sound.play('warn');
  const bad = ev.bad[0].poly;
  banner(`${t('snipeTitle')}`);
  if (isSimple()) {
    // 簡易玩法：冇截胡；只係棄走唔夠簡嗰張卡，其他卡退返手上
    game.discard(pi, ev.bad.map(c => c.id));
    ui.staged = null; undim(); view.setGlow(0);
    const g = bad.content();
    banner(t('incompleteSimple', { f: tex(par(bad)), g, p: tex(par(new Poly(bad.terms().map(x => [x.i + ',' + x.j, x.c / g])))) }));
    await relayout(520);
    await wait(2600);
    return 'done';
  }
  const react = await reactionWindow('snipe', pi, targetId, ev);
  game.discard(pi, cardIds);
  ui.staged = null; undim(); view.setGlow(0);
  if (react) {
    game.discard(react.pi, [react.cardId]);
    game.award(react.pi, targetId);
    session.claimed.set(targetId, react.pi);
    if (react.pi === 0) session.stats.snipe++;
    Sound.play('snipe'); view.successFx(0xffc46b);
    banner(t('snipedBy', { name: nameOf(react.pi) }));
    const lay = relayout(620);
    renderScoreboard();
    await cutIn(react.pi, target);
    await lay;
    await showVerify(react.pi, target, target.answer, null, true);
  } else {
    banner(t('incompleteReveal', { f: tex(par(bad)), g: bad.content() }));
    await relayout(520);
    await wait(1800);
  }
  return 'done';
}

/* 反應窗口：真人用大掣，電腦按難度延遲 */
function reactionWindow(kind, synthPi, targetId, ev) {
  return abortable(new Promise(resolve => {
    const ms = CFG.reactionMs[kind], t0 = performance.now();
    const timers = []; let done = false;
    const me = game.player(0);
    const humanCanAct = synthPi !== 0;
    let humanEligible = false, handId = null;
    if (kind === 'hand') handId = me.hand.find(id => game.card(id).kind === 'func' && game.card(id).func === 'hand') || null;
    else humanEligible = humanCanAct && me.hand.some(id => snipeValid(game.card(id), ev));
    const hasConst = me.hand.some(id => { const c = game.card(id); return (c.kind === 'factor' && c.poly.isConstant()) || (c.kind === 'func' && c.func === 'stone'); });
    const box = $('reaction'), btn = $('reactBtn'), ring = btn.querySelector('circle');
    const C = 2 * Math.PI * 46; ring.style.strokeDasharray = C;
    box.hidden = false; box.classList.toggle('watch', !humanCanAct);
    if (kind === 'hand') {
      $('reactTitle').innerHTML = humanCanAct ? `${t('handTitle', { name: nameOf(synthPi) })}<span class="sub">${t('handSub')}</span>` : t('waitReact');
      $('reactLabel').innerHTML = handId ? t('handBtn') : t('noHand');
      btn.disabled = !handId;
    } else {
      $('reactTitle').innerHTML = `${t('snipeTitle')}<span class="sub">${humanCanAct ? t('snipeSub') : tp('watchOnly')}</span>`;
      $('reactLabel').innerHTML = hasConst ? t('snipeBtn') : t('noSnipeCard');
      btn.disabled = !hasConst;
      if (humanCanAct && hasConst) { ui.mode = 'snipe'; ui.pick = null; }
    }
    let lastSec = -1;
    const tick = setInterval(() => {
      const left = Math.max(0, ms - (performance.now() - t0));
      ring.style.strokeDashoffset = C * (1 - left / ms);
      const sec = Math.ceil(left / 1000);
      $('reactCount').textContent = sec;
      if (sec !== lastSec) { lastSec = sec; if (sec > 0) Sound.play('tick'); }
    }, 50);
    const finish = (r) => {
      if (done) return; done = true;
      clearInterval(tick); timers.forEach(clearTimeout);
      box.hidden = true; btn.onclick = null;
      if (ui.mode === 'snipe') { ui.mode = 'idle'; ui.pick = null; }
      if (kind === 'snipe' && humanEligible && !(r && r.pi === 0)) session.stats.snipeMissed++;
      resolve(r);
    };
    session.abortP.catch(() => finish(null));
    btn.onclick = () => {
      if (!humanCanAct || done) return;
      if (kind === 'hand') { if (handId) finish({ pi: 0, cardId: handId }); return; }
      if (!ui.pick) { toast(t('snipeNeedCard'), 'bad'); return; }
      const c = game.card(ui.pick);
      if (snipeValid(c, ev)) { finish({ pi: 0, cardId: ui.pick }); return; }
      Sound.play('fail');
      toast(t('snipeBad', { c: c.kind === 'func' ? tp('stone') : c.poly.constValue() }), 'bad', 2600);
      btn.disabled = true; ui.mode = 'idle'; ui.pick = null; view.layout(game, ui, 160);
    };
    for (let pi = 1; pi < game.players.length; pi++) {
      if (pi === synthPi) continue;
      const P = CFG.ai[game.player(pi).difficulty];
      const d = kind === 'hand' ? AI.decideHand(game, pi, synthPi, targetId, P) : AI.decideSnipe(game, pi, ev, P);
      if (d && d.delay < ms) timers.push(setTimeout(() => finish({ pi, cardId: d.cardId }), d.delay));
    }
    timers.push(setTimeout(() => finish(null), ms));
    view.layout(game, ui, 160);
  }));
}

/* ---------- 驗算：觀察 → 分解 → 驗算 ---------- */
function buildProof(target, factors) {
  const T = target.poly, Tt = T.toTeX();
  const consts = factors.filter(f => f.isConstant()), monos = factors.filter(f => f.isMonomial() && !f.isConstant()), lins = factors.filter(f => !f.isMonomial());
  const k = consts.reduce((a, f) => a * f.constValue(), 1);
  const front = Poly.product([Poly.const(k), ...monos]);       // 公因式部分
  const inner = Poly.product(lins);                            // 抽完公因式之後
  const finalTeX = factorsToTeX(factors);
  const frontTeX = front.isConstant() && front.constValue() === 1 ? '' : front.toTeX();
  const obs = [], fac = [`${Tt}`];
  const m = methodOf(target);
  if (m === 'common') {
    const g = monoGcd(T);
    obs.push(t('obsCommon', { g: tex(g.toTeX()) }));
    fac.push(finalTeX);
  } else if (m === 'group') {
    if (frontTeX) { obs.push(t('obsGroupCommon', { g: tex(frontTeX) })); fac.push(`${frontTeX}(${inner.toTeX()})`); }
    else obs.push(t('obsGroup'));
    const [A, B] = lins;
    if (A && B) {
      const groups = A.terms().map(tm => Poly.mono(tm.c, tm.i, tm.j));
      const pre = frontTeX ? `${frontTeX}[` : '', post = frontTeX ? ']' : '';
      const g1 = groups.map((g, n) => { const e = g.mul(B); const s = `(${e.toTeX()})`; return n === 0 ? s : (e.leadingCoeff() < 0 ? `- (${e.neg().toTeX()})` : `+ ${s}`); }).join(' ');
      const g2 = groups.map((g, n) => { const s = `${g.toTeX().replace(/^1$/, '1')}(${B.toTeX()})`; const neg = g.leadingCoeff() < 0; return n === 0 ? s : (neg ? s.replace(/^-/, '- ') : '+ ' + s); }).join(' ');
      fac.push(`${pre}${g1}${post}`, `${pre}${g2}${post}`);
    }
    fac.push(finalTeX);
  } else {
    if (frontTeX) { obs.push(t('obsFirst', { g: tex(frontTeX) })); fac.push(`${frontTeX}(${inner.toTeX()})`); }
    const [A, B] = lins;
    const ta = A.terms(), a = Poly.mono(ta[0].c, ta[0].i, ta[0].j), b = Poly.mono(Math.abs(ta[1].c), ta[1].i, ta[1].j);
    const sq = (p) => (p.isConstant() || (p.leadingCoeff() === 1)) ? `${par(p)}^{2}`.replace(/^\((\w)\)/, '$1') : `(${p.toTeX()})^{2}`;
    const wrap = (s) => frontTeX ? `${frontTeX}[${s}]` : s;
    if (A.equals(B)) {
      obs.push(t('obsPerf'));
      const sign = ta[1].c < 0 ? '-' : '+';
      fac.push(wrap(`${sq(a)} ${sign} 2(${a.toTeX()})(${b.toTeX()}) + ${sq(b)}`));
    } else {
      obs.push(t('obsDiff'));
      fac.push(wrap(`${sq(a)} - ${sq(b)}`));
    }
    fac.push(finalTeX);
  }
  // 驗算：逐步展開
  const chk = [finalTeX];
  if (lins.length >= 2) {
    const [A, B] = lins;
    const dist = A.terms().map((tm, n) => { const g = Poly.mono(tm.c, tm.i, tm.j); const s = `${g.toTeX()}(${B.toTeX()})`; return n === 0 ? s : (tm.c < 0 ? s.replace(/^-/, '- ') : '+ ' + s); }).join(' ');
    chk.push(frontTeX ? `${frontTeX}[${dist}]` : dist);
    const AB = A.mul(B);
    if (frontTeX) chk.push(`${frontTeX}(${AB.toTeX()})`);
  }
  else if (lins.length === 1 && frontTeX) {
    const L = lins[0];
    chk.push(L.terms().map((tm, n) => { const g = Poly.mono(tm.c, tm.i, tm.j); const s = `${frontTeX}\\cdot ${g.toTeX()}`; return n === 0 ? s : (tm.c < 0 ? `- ${frontTeX}\\cdot ${Poly.mono(-tm.c, tm.i, tm.j).toTeX()}` : '+ ' + s); }).join(' '));
  }
  chk.push(Poly.product(factors).toTeX());
  return { obs, fac, chk, ok: Poly.product(factors).equals(T) };
}
function showVerify(pi, target, factors, stoneValue, isModel = false) {
  return abortable(new Promise(resolve => {
    const pr = buildProof(target, factors);
    $('verifyTitle').innerHTML = `${tp('verifyTitle')} · ${tex(target.poly.toTeX())}`;
    $('verifyWho').innerHTML = (isModel ? t('verifyAnswer') : t('verifyBy', { name: nameOf(pi) })) + (stoneValue ? ` · ${t('stoneAs', { k: stoneValue })}` : '');
    const step = (tag, body) => `<div class="vstep"><div class="tag">${tag}</div><div class="body">${body}</div></div>`;
    const methodName = t(methodOf(target));
    const chain = (arr) => tex(arr.map((s, n) => (n ? '= ' : '') + s).join(' \\\\ ').replace(/^/, '\\begin{aligned}&').replace(/ \\\\ = /g, ' \\\\ &= ') + '\\end{aligned}');
    $('verifySteps').innerHTML =
      step(t('observe'), `<b>${methodName}</b><br>${pr.obs.join('<br>')}`) +
      step(t('factorize'), chain(pr.fac)) +
      step(t('check'), chain(pr.chk) + `<br>${pr.ok ? t('equal') : ''}`);
    const modal = $('modalVerify'); modal.hidden = false;
    const steps = [...modal.querySelectorAll('.vstep')];
    steps.forEach((s, n) => setTimeout(() => s.classList.add('show'), 150 + n * 450));
    let auto = null;
    const close = () => { modal.hidden = true; clearTimeout(auto); $('btnVerifyOk').onclick = null; resolve(); };
    $('btnVerifyOk').onclick = () => { Sound.play('select'); close(); };
    if (pi !== 0) auto = setTimeout(close, 7000);
    session.abortP.catch(() => { modal.hidden = true; clearTimeout(auto); });
  }));
}

/* ---------- 完局 ---------- */
async function finishGame() {
  session.finished = true; ui.interactive = false; updateButtons();
  const winner = game.players.find(p => p.score >= game.cfg.winScore);
  banner(winner ? t('gameOverScore', { name: nameOf(winner.idx), n: game.cfg.winScore }) : t('gameOverDeck'));
  await wait(1600);
  const ranks = game.ranking(), top = Math.max(...game.players.map(p => p.score));
  const result = ranks[0] === 1 ? (game.players.filter(p => p.score === top).length > 1 ? 'draw' : 'win') : 'lose';
  // 闖關完成：第一次答對夠 badgePass 題就得到徽章
  let lvRes = null;
  if (LEVELS.includes(session.mode)) {
    const lv = session.mode, total = [...game.cards.values()].filter(c => c.kind === 'target').length, score = session.firstCount;
    const wasBadge = !!state.badges[lv];
    const lockedBefore = PLAYER_CHARS.filter(k => !partnerUnlocked(k));
    state.tries[lv] = (state.tries[lv] || 0) + 1;
    state.best[lv] = Math.max(state.best[lv] || 0, score);
    if (score >= CFG.badgePass) state.badges[lv] = true;
    const newBadge = !wasBadge && !!state.badges[lv];
    save();
    logEvent('house_result', { place: lv, topic: STR[lv][0], score, total, badge: !!state.badges[lv], newBadge });
    lvRes = { lv, score, total, newBadge, badge: !!state.badges[lv], unlocked: lockedBefore.filter(partnerUnlocked) };
    if (newBadge && badgeCount() >= GAME.total && !state.won) { state.won = true; save(); logEvent('win'); lvRes.win = true; }
  }
  Sound.play(lvRes ? (lvRes.newBadge ? 'win' : lvRes.badge ? 'success' : 'lose') : result === 'win' ? 'win' : result === 'draw' ? 'success' : 'lose');
  showReview(result, lvRes);
  if (lvRes && lvRes.newBadge) view.successFx(0xffd27a);
  session.active = false;
}

       ${lvRes.unlocked.map(k => `<div class="big-result" style="font-size:1.2em">${ART.symbol(k).replace('<svg ', '<svg style="width:1.8em;height:1.8em;vertical-align:middle" ')} ${t('unlockNew', { name: charName(k) })}</div>`).join('')}
       ${lvRes.win ? `<div class="big-result">${t('allBadges')}</div>` : ''}`

    <p class="sync">💰 ${tp('bellsEarned', { b: session.bellsEarned })} · 🏅 ${badgeCount()}/${GAME.total} · 📒 ${state.notebook.length} · ${t(recordingOn() ? 'recOnShort' : 'recOff')}</p>
    <h2>${t('stats')}</h2>

    ${session.rules === 'simple' ? '' : `<tr><td>${t('stSnipe')}</td><td>${st.snipe}</td><td>${t('stMiss')}</td><td>${st.snipeMissed}</td><td>${t('stDestroyed')}</td><td>${st.destroyed}</td></tr>`}
    <tr><td>${t('stHints')}</td><td>${st.hints}</td><td colspan="4"></td></tr></table>
    <h2>${t('mistakes')}</h2>
    ${mis ? `<table class="review"><tr><th></th><th>${t('target')}</th><th>${t('played')}</th><th>${t('why')}</th><th>${t('answer')}</th></tr>${mis}</table>` : `<p>${t('noMistakes')}</p>`}
    <h2>${t('seen')}</h2>

    <div class="row-btns"><button class="btn primary" id="btnAgain">${t('playAgain')}</button>${state.notebook.length ? `<button class="btn" id="btnReviewNb">${t('notebookBtn', { n: state.notebook.length })}</button>` : ''}<button class="btn" id="btnBack">${t('backSetup')}</button></div>`;
  $('hud').hidden = true;
  $('screenReview').hidden = false;
  $('btnAgain').onclick = () => { Sound.play('select'); startGame(); };

}

    [{ char: setupSel.char, isHuman: true }]);
  let abort; const abortP = new Promise((_, rej) => { abort = () => rej(new AbortGame()); });
  abortP.catch(() => {});
  session = {
    settings: { ...setupSel }, rules: 'simple', mode: 'notebook', place: 'notebook', start: new Date(), active: true, finished: false, abort, abortP,
    tries: new Map(), t0: new Map(), hinted: new Set(), wasNb: new Map(), firstCount: 0, bellsEarned: 0, fixedCount: 0,
    hintsLeft: CFG.hintsPerGame, lowfxChecked: true, partner: setupSel.char, skillLeft: 0,
    stats: { succ: { 1: 0, 2: 0, 3: 0 }, wrong: 0, incomplete: 0, snipe: 0, snipeMissed: 0, destroyed: 0, hints: 0 },

  };
  for (const { obj } of view.objs.values()) view.cssScene.remove(obj);
  view.objs.clear();
  for (const c of game.cards.values()) view.createCard(c);
  view.buildLayout(2);
  view.setupPiles(game.players);
  resetUI();
  hideAllScreens(); $('hud').hidden = false;
  const order = ids.map(id => [...game.cards.values()].find(c => c.kind === 'target' && qidOf(c) === id)).filter(Boolean);
  try {
    for (let i = 0; i < order.length && session.active; i++) {
      const target = order[i], me = game.player(0);
      // 收返上一題嘅卡，派新一題
      game.drawPile.push(...me.hand.splice(0), ...game.discardPile.splice(0));
      game.table.forEach(tt => game.targetDeck.push(tt.id)); game.table = [];
      game.targetDeck = game.targetDeck.filter(id => id !== target.id);
      game.table = [{ id: target.id, since: 0 }];
      const factors = [...game.cards.values()].filter(c => c.kind === 'factor');
      const used = new Set(), pick = (poly) => { const c = factors.find(f => !used.has(f.id) && f.poly.equals(poly)); if (c) used.add(c.id); return c; };
      const need = target.answer.map(pick).filter(Boolean);
      const others = shuffle(factors.filter(f => !used.has(f.id) && !target.answer.some(a => a.equals(f.poly)))).slice(0, 4);
      me.hand = shuffle(need.concat(others).map(c => c.id));
      game.drawPile = game.drawPile.filter(id => !me.hand.includes(id));
      session.t0 = new Map([[target.id, Date.now()]]);
      ui.selectedTarget = target.id;
      renderScoreboard();
      await relayout(500);
      banner(t('practiceBanner', { i: i + 1, n: order.length }));
      ui.interactive = true; ui.mode = 'main'; updateButtons(); renderPreview();
      for (;;) {
        const a = await waitAction();
        ui.interactive = false; updateButtons();
        if (a.type === 'synth') {
          const r = await resolveSynthesis(0, a.targetId, a.cardIds);
          if (r === 'retry') { ui.interactive = true; ui.mode = 'main'; ui.selectedTarget = target.id; banner(t('practiceBanner', { i: i + 1, n: order.length })); updateButtons(); renderPreview(); relayout(200).catch(() => {}); continue; }
        }
        break;                                   // 鍊成完成，或者按「跳過」
      }
      ui.selected.clear(); ui.selectedTarget = null; ui.mode = 'idle';
    }
    session.active = false;
    toast(t('practiceDone', { f: session.fixedCount }), 'good', 3500);
    showSetup();
  } catch (e) {
    if (!(e instanceof AbortGame)) { console.error(e); toast('⚠ ' + e.message, 'bad', 6000); }
  }
}

function confirmBox(html) {
  return new Promise(res => {
    $('confirmText').innerHTML = html; $('modalConfirm').hidden = false;
    $('btnYes').onclick = () => { $('modalConfirm').hidden = true; res(true); };
    $('btnNo').onclick = () => { $('modalConfirm').hidden = true; res(false); };
  });
}

  <h2>四種方法</h2><p>★ 提取公因式　★★ 分組分解　★★★ 平方差恆等式 ${tex('a^2-b^2=(a+b)(a-b)')}、完全平方恆等式 ${tex('a^2\\pm 2ab+b^2=(a\\pm b)^2')}</p>

function rulesHTML() {
  const zh = `<h1 style="font-size:1.6em">規則</h1>
  <h2>目標</h2><p>用手上嘅因式組件卡，鍊成桌面上嘅目標多項式。先夠 <b>${CFG.winScore}</b> 分勝出；目標卡用完就最高分者勝。</p>
  <h2>每個回合</h2><ol><li>自動抽 1 張牌。</li><li>可以用功能卡（逆鍊成）。</li><li>揀 1 張目標卡同幾張手牌，按「鍊成！」。</li><li>冇鍊成可以「棄一抽一」，或者直接結束回合。</li><li>手牌上限 ${CFG.handLimit} 張。</li></ol>
  <h2>合成判定</h2><ul><li><b>乘積錯</b>：等價交換失敗！卡退返手上，要棄 1 張做代價。</li><li><b>正確又最簡</b>：${CFG.reactionMs.hand / 1000} 秒反應窗口，冇人打「分解之手」就得分。</li><li><b>正確但唔最簡</b>（例如用咗 (2x + 4)）：${CFG.reactionMs.snipe / 1000} 秒「分解不徹底！」，其他人可以用能整除公因數嘅常數卡（或賢者之石）截胡。</li></ul>
  <h2>最簡因式組合</h2><ul><li>所有卡相乘要等於目標；出卡次序唔重要。</li><li>每張一次因式卡要 primitive：係數 gcd = 1，首項係數係正數。</li><li>重複因式要出兩張，例如 (x + 3)² 要出兩張 (x + 3)。</li><li>常數可以拆開出，例如 6 = 2 × 3。</li></ul>
  <h2>功能卡</h2><ul><li><b>逆鍊成</b>：將手上一張一次因式嘅 +/− 互換，例如 (x − 2) → (x + 2)。</li><li><b>賢者之石</b>：鍊成時當任意一個正整數常數。</li><li><b>分解之手</b>：只可以喺反應窗口打出，強制展開對手嘅鍊成，目標卡退返桌面。</li></ul>
  <h2>真理之門</h2><p>一整輪冇人成功鍊成，就會換走桌面上最舊嗰張目標卡。</p>
  <h2>四種方法</h2><p>★ 提取公因式（1 分）　★★ 分組分解（2 分）　★★★ 平方差恆等式／完全平方恆等式（3 分）</p>`;
  const en = `<h1 style="font-size:1.6em">Rules</h1>
  <h2>Goal</h2><p>Use factor cards to transmute (factorize) the target polynomials on the table. First to <b>${CFG.winScore}</b> points wins; if the targets run out, the highest score wins.</p>
  <h2>Your turn</h2><ol><li>Draw 1 card automatically.</li><li>You may use function cards (Reverse).</li><li>Select 1 target and some hand cards, then press Transmute!</li><li>If you did not transmute, you may swap 1 card (discard 1, draw 1) or just end your turn.</li><li>Hand limit: ${CFG.handLimit} cards.</li></ol>
  <h2>Judgement</h2><ul><li><b>Wrong product</b>: Equivalent Exchange fails. Cards return to your hand and you discard 1 card as the price.</li><li><b>Correct and complete</b>: a ${CFG.reactionMs.hand / 1000}-second reaction window for the Hand of Decomposition, then you score.</li><li><b>Correct but incomplete</b> (e.g. using (2x + 4)): a ${CFG.reactionMs.snipe / 1000}-second window. Others may snipe with a constant card that divides the content (or a Stone).</li></ul>
  <h2>Complete factorization</h2><ul><li>The cards must multiply to the target; order does not matter.</li><li>Every linear factor must be primitive: coefficient gcd = 1 and a positive leading coefficient.</li><li>Repeated factors need two cards, e.g. (x + 3)² needs two (x + 3).</li><li>Constants may be split, e.g. 6 = 2 × 3.</li></ul>
  <h2>Function cards</h2><ul><li><b>Reverse</b>: flip +/− of a linear factor in your hand, e.g. (x − 2) → (x + 2).</li><li><b>Philosopher's Stone</b>: counts as any positive integer in a transmutation.</li><li><b>Hand of Decomposition</b>: only in a reaction window; forces an opponent's transmutation apart and the target returns to the table.</li></ul>
  <h2>Gate of Truth</h2><p>If nobody succeeds for a whole round, the oldest target on the table is replaced.</p>
  <h2>Four methods</h2><p>★ common factor (1 pt) · ★★ grouping (2 pts) · ★★★ difference of two squares / perfect square (3 pts)</p>`;
  return LANG === 'zh' ? zh : LANG === 'en' ? en : zh + '<hr>' + en;
}
function bindStatic() {
  $('segLang').onclick = (e) => { const b = e.target.closest('button'); if (b) { setSeg('segLang', b.dataset.v); Sound.ensure(); Sound.play('select'); } };
  $('segPlayers').onclick = (e) => { const b = e.target.closest('button'); if (b) { setupSel.players = Number(b.dataset.v); setSeg('segPlayers', b.dataset.v); Sound.play('select'); } };
  $('btnLogin').onclick = () => { Sound.ensure(); doLogin(); };
  $('inName').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  $('btnNotMe').onclick = notMe;
  $('btnNotMe2').onclick = notMe;
  $('btnStart').onclick = () => { Sound.play('clap'); startGame(); };
  $('btnNotebook').onclick = () => { Sound.play('select'); startPractice(); };
  $('btnDex').onclick = () => { Sound.play('select'); showDex(); };
  $('btnSkill').onclick = () => { if (!$('btnSkill').disabled) act({ type: 'skill' }); };
  $('btnRules').onclick = () => showRules(false); $('btnRules2').onclick = () => showRules(false);
  $('btnMute').onclick = () => { Sound.ensure(); Sound.setMuted(!Sound.muted); updateMuteBtn(); };
  $('btnFx').onclick = () => { view.setLowFx(!view.lowfx); updateFxBtn(); toast(t(view.lowfx ? 'lowfxOn' : 'lowfxOff')); };
  $('btnQuit').onclick = async () => {
    if (!session || !session.active) return showSetup();
    if (!(await confirmBox(t('quitConfirm')))) return;
    endSession(); resetUI(); $('tipPanel').hidden = true; showSetup();
  };
  $('btnSynth').onclick = () => { if (!$('btnSynth').disabled) act({ type: 'synth', targetId: ui.selectedTarget, cardIds: [...ui.selected] }); };
  $('btnSwap').onclick = () => { if (!$('btnSwap').disabled) act({ type: 'swap', cardId: [...ui.selected][0] }); };
  $('btnEnd').onclick = () => {
    if ($('btnEnd').disabled) return;
    if (isSimple() && ui.selected.size === 1 && !ui.selectedTarget) act({ type: 'swap', cardId: [...ui.selected][0] });
    else act({ type: 'end' });
  };
  $('btnConfirm').onclick = () => { if (ui.pick) { Sound.play('deal'); act({ type: 'discard', cardId: ui.pick }); } };
  $('btnHint').onclick = () => {
    if (!session || session.hintsLeft <= 0) { toast(t('hintNone'), 'bad'); return; }
    if (!ui.selectedTarget) { toast(t('hintPick')); return; }
    session.hintsLeft--; session.stats.hints++;
    const ht = game.card(ui.selectedTarget); session.hinted.add(ht.id);
    logEvent('hint', { qid: qidOf(ht), topic: topicOf(ht) });
    toast(t('hintText', { m: t(methodOf(game.card(ui.selectedTarget))) }), 'good', 3500);
    Sound.play('select'); updateButtons();
  };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && ui.mode === 'reverse') { view.setClass(ui.reverseFunc, 'pick', false); ui.mode = 'main'; ui.reverseFunc = null; banner(t('yourTurn')); }
  });
  updateMuteBtn(); updateFxBtn();
}

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
